- name: configure payment server
  hosts: payment
  become: yes
  tasks: 
  - name: install python packages
    ansible.builtin.dnf:
      name: "{{ item }}"
      state: present
    loop:
    - pyhton3
    - gcc
    - python3-devel

  - name: create roboshop system user
    ansible.builtin.user:
      name: roboshop
      comment: roboshop system user
      system: true
      shell: /sbin/nologin
      home: /app

  - name: remove app directory
    ansible.builtin.file:
        path: /app
        state: absent

  - name: create app directory
    ansible.builtin.file:
        state: directory
        path: /app

  - name: delete the payment file
    ansible.builtin.file:
        path: /tmp/payment.zip
        state: absent

  - name: download catalogue application
    ansible.builtin.get_url:
         url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip
         dest: /tmp/payment.zip

  - name: extract catalogue application
    ansible.builtin.unarchive:
        src: /tmp/payment.zip
        dest: /app
        remote_src: yes

  - name: copy payment service
    ansible.builtin.copy:
      src: payment.service
      dest: /etc/systemd/system/payment.service

  - name: start and enabled the server
    ansible.builtin.service:
      name: payment
      state: started
      enabled: yes



